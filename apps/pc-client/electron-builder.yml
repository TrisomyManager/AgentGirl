appId: com.xiaonuan.pc-client
productName: 小暖
copyright: Copyright 2026
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - tools/**/*
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
extraResources:
  - from: tools/
    to: tools/
    filter:
      - "**/*.py"
      - "**/*.txt"
