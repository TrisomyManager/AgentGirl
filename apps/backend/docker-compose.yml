name: companion
services:
  initialize:
    image: companion-ai:local
    build: .
    user: "0:0"
    network_mode: none
    command: ["python", "-m", "shared_runtime.container_setup"]
    volumes:
      - ${COMPANION_ACCESS_CONFIG_PATH:-./companion_access_config.json}:/seed/access.json:ro
      - application_data:/data
    restart: "no"
  app:
    image: companion-ai:local
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${COMPANION_HTTP_PORT:-8000}:8000"
    environment:
      COMPANION_ACCESS_CONFIG_FILE: /data/access.json
      COMPANION_LITE_MODE: ${COMPANION_LITE_MODE:-true}
      COMPANION_CORS_ORIGINS: ${COMPANION_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      COMPANION_ARK_API_KEY: ${COMPANION_ARK_API_KEY:-}
      COMPANION_VOLC_API_KEY: ${COMPANION_VOLC_API_KEY:-}
      COMPANION_POSTGRES_URL: ${COMPANION_POSTGRES_URL:-postgresql://companion@postgres:5432/companion}
      COMPANION_REDIS_URL: redis://redis:6379/0
      COMPANION_NEO4J_URI: bolt://neo4j:7687
      COMPANION_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      COMPANION_MQTT_BROKER_HOST: mosquitto
    volumes:
      - application_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  postgres:
    profiles: [storage]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: companion
      POSTGRES_DB: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    profiles: [storage]
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    volumes:
      - neo4j_data:/data
  redis:
    profiles: [storage]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
  mosquitto:
    profiles: [storage]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
volumes:
  application_data:
  postgres_data:
  neo4j_data:
  redis_data:
  mosquitto_data:
